<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>龙裔配置测试</title>
  <style>
    body { background: #141b27; color: #e2e8f0; font-family: monospace; padding: 20px; }
    .section { margin: 20px 0; padding: 15px; background: #1a2333; border-left: 3px solid #c79a42; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    pre { background: #0f172a; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>龙裔种族配置测试</h1>
  <div id="results"></div>

  <script type="module">
    // 模拟导入 races.js (由于模块依赖问题,我们直接检查文件内容)
    const results = document.getElementById('results');
    
    async function testConfig() {
      try {
        // 读取 races.js 文件内容
        const response = await fetch('/src/data/races.js');
        const content = await response.text();
        
        const tests = [
          {
            name: '吐息武器包含 charge_item',
            check: () => content.includes("id: 'dragonborn_breath_weapon'") && 
                        content.includes("effectType: 'charge_item'") &&
                        content.match(/dragonborn_breath_weapon[\s\S]*?effectType:\s*'charge_item'/),
          },
          {
            name: '吐息武器配置了充能机制',
            check: () => content.includes("resourceType: 'charges'") &&
                        content.includes("recovery: { method: 'long_rest', kind: 'full' }"),
          },
          {
            name: '吐息武器使用主要动作',
            check: () => content.includes("actionCost: 'action'"),
          },
          {
            name: '龙族飞翼包含 charge_item',
            check: () => content.includes("id: 'dragonborn_draconic_flight'") &&
                        content.match(/dragonborn_draconic_flight[\s\S]*?effectType:\s*'charge_item'/),
          },
          {
            name: '龙族飞翼使用附赠动作',
            check: () => content.includes("actionCost: 'bonus'"),
          },
          {
            name: '龙族飞翼配置了持续时间',
            check: () => content.includes("duration: { type: 'minutes', value: 10 }"),
          },
          {
            name: '龙族血统包含10种龙类型',
            check: () => {
              const matches = content.match(/id:\s*'(white|black|green|blue|red|brass|copper|bronze|silver|gold)'/g);
              return matches && matches.length >= 10;
            },
          },
          {
            name: '每种龙类型都有伤害抗性效果',
            check: () => {
              const resistMatches = content.match(/effectType:\s*'damage_type_relation'/g);
              return resistMatches && resistMatches.length >= 10;
            },
          },
        ];
        
        let html = '<div class="section">';
        html += `<h2>测试结果 (${tests.filter(t => t.check()).length}/${tests.length} 通过)</h2>`;
        
        tests.forEach(test => {
          const passed = test.check();
          html += `<div class="${passed ? 'success' : 'error'}">`;
          html += `✓ ${passed ? '✓' : '✗'} ${test.name}`;
          html += '</div>';
        });
        
        html += '</div>';
        
        // 显示关键配置片段
        html += '<div class="section"><h2>吐息武器配置片段</h2><pre>';
        const breathMatch = content.match(/id:\s*'dragonborn_breath_weapon'[\s\S]*?cards:\s*\[[\s\S]*?\],/);
        if (breathMatch) {
          html += breathMatch[0].substring(0, 500) + '...';
        }
        html += '</pre></div>';
        
        html += '<div class="section"><h2>龙族飞翼配置片段</h2><pre>';
        const flightMatch = content.match(/id:\s*'dragonborn_draconic_flight'[\s\S]*?cards:\s*\[[\s\S]*?\],/);
        if (flightMatch) {
          html += flightMatch[0].substring(0, 500) + '...';
        }
        html += '</pre></div>';
        
        results.innerHTML = html;
        
      } catch (err) {
        results.innerHTML = `<div class="error">测试失败: ${err.message}</div>`;
      }
    }
    
    testConfig();
  </script>
</body>
</html>
